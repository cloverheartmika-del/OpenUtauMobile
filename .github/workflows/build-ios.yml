name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.100'
      - name: Install MAUI
        run: |
          dotnet workload install maui
          dotnet workload install android ios
          dotnet workload restore
      - name: Restore
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFramework=net9.0-ios
      - name: Build IPA
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -f net9.0-ios -c Debug -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="" -p:CodesignProvision="" -p:BuildIpa=true
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "**/*.ipa"
